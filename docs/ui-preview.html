<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HDMI 遥控 · SunnyUI 预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1119;color:#edf0f6;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}header{font-size:13px;padding:14px 24px;color:#a7b1c0;display:flex;justify-content:space-between}#tv{width:960px;min-height:540px;margin:0 auto;background:#111821;padding:28px 48px;box-shadow:0 12px 40px #20345212}small{font-size:15px;color:#9dbbff;font-weight:700}h1{font-size:30px;margin:20px 0 8px;line-height:1.4}p{font-size:16px;line-height:1.65;color:#a7b1c0;margin:0}.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:36px}button{font:18px 'Microsoft YaHei',sans-serif;color:#edf0f6;background:#1a2431;border:1px solid #405675;border-radius:12px;box-shadow:0 3px 0 #9dbbff14;min-height:58px;padding:12px 20px;cursor:pointer}button:focus-visible{outline:none;border:3px solid #9dbbff;background:#263a56;padding:10px 18px}button:active{background:#304b70;border-color:#9dbbff}.actions button{height:142px;font-size:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px}.actions button:last-child{font-size:20px}.status{margin-top:26px;font-size:16px}.note{margin-top:12px;font-size:14px}.list{display:grid;gap:12px;margin-top:24px}.list button{text-align:left}.list button.chosen{background:#263a56;border-color:#9dbbff}footer{padding:15px;text-align:center;color:#a7b1c0;font-size:12px}label{display:block;margin:18px 0 6px;color:#a7b1c0}input{width:100%;padding:14px;font:18px inherit;border:1px solid #405675;border-radius:12px;color:#edf0f6}input:focus{outline:3px solid #9dbbff}a{color:#9dbbff}@media(max-width:980px){#tv{width:96%;padding:28px}.actions{grid-template-columns:1fr 1fr}}@media(max-width:560px){.actions{grid-template-columns:1fr}h1{font-size:26px}}
</style><header><span>0.4.0 · UI 审阅预览</span><span>SunnyUI 晴蓝 × 精致描边 · 深色</span></header><main id="tv"></main><footer>布局交互稿 · 非电视实机截图 · 预览状态为示例，不操作电视或 NAS。支持方向键、Enter 和 Esc。</footer>
<script>
const tv=document.querySelector('#tv');let hdmi=3,auto=true,page='home';
function shell(name,title,sub){page=name;tv.innerHTML='<small>HDMI 遥控</small><h1>'+title+'</h1><p>'+sub+'</p>';}
function list(items){let x=document.createElement('div');x.className='list';tv.append(x);items.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;x.append(b)});x.querySelector('button')?.focus()}
function home(){shell('home','一只遥控器，就够了。','选择 NAS 所在的 HDMI 通道，切过去即可控制。');tv.insertAdjacentHTML('beforeend','<div class="actions"><button id="channel"><span>选择 HDMI 通道</span><span>HDMI '+hdmi+'</span></button><button id="more"><span>更多设置</span><span>权限 · 连接 · 诊断</span></button></div><p class="status">'+(auto?'●  后台已就绪 · 切到 HDMI '+hdmi+' 自动连接':'自动连接已关闭')+'</p><p class="note">切换输入源后自动接管 · 返回电视首页后停止</p>');document.querySelector('#channel').onclick=channels;document.querySelector('#more').onclick=settings;document.querySelector('#channel').focus()}
function channels(){shell('channels','NAS 接在哪个通道？','HDMI 3 已实测。其他通道需在更多设置中校准输入源编号。');list([...[1,2,3,4].map(n=>['HDMI '+n+(n===hdmi?'   ✓ 已选择':''),()=>{hdmi=n;home()}]),['返回',home]])}
function settings(){shell('settings','更多设置','日常使用无需填写 NAS 地址；首次使用请先开启后台权限。');list([['自动连接  ·  '+(auto?'已开启':'已关闭'),()=>{auto=!auto;settings()}],['无障碍与开机自启动',permissions],['连接与通道校准',connection],['按键诊断',diagnostics],['暂停本次转发',()=>{}],['返回',home]])}
function permissions(){shell('permissions','后台权限','只需首次设置；后台就绪后，不必每次打开本应用。');tv.insertAdjacentHTML('beforeend','<p style="margin-top:24px;color:#edf0f6;font-size:18px">1. 启用本应用的无障碍服务。若电视没有入口，可按项目说明用 ADB 授权。<br>2. 在电视权限管理中允许本应用自启动与关联启动。<br>3. 切到所选 HDMI，后台自动发现并连接 NAS。</p>');list([['打开无障碍设置（仅预览）',()=>{}],['打开电视自启动管理（仅预览）',()=>{}],['返回',settings]])}
function connection(){shell('connection','连接与通道校准','自动发现优先。只有发现失败时才使用下面的备用地址与配对码。');[['NAS 地址（可留空）',''],['TCP 端口','8765'],['备用配对码（可留空）',''],['HDMI '+hdmi+' 的输入源编号',hdmi===3?'10':'-1']].forEach(([l,v])=>{let label=document.createElement('label');label.textContent=l;let input=document.createElement('input');input.value=v;tv.append(label,input)});list([['保存（仅预览）',settings],['返回',settings]])}
function diagnostics(){shell('diagnostics','按键诊断','仅手动开始后记录 90 秒，最多 80 条；记录只保存在电视本地。');list([['开始测试：应用内',()=>{}],['开始测试：电视桌面',()=>{}],['开始测试：HDMI 画面',()=>{}],['停止记录',()=>{}],['清除记录',()=>{}],['返回',settings]])}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();(['channels','settings'].includes(page)?home:settings)();return}if(!e.key.startsWith('Arrow')||e.target.tagName==='INPUT')return;let bs=[...tv.querySelectorAll('button')],i=bs.indexOf(document.activeElement);let step=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1;bs[Math.max(0,Math.min(bs.length-1,i+step))]?.focus();e.preventDefault()});home();
</script></html>
